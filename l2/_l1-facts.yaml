# Factos normalizados extraídos do Protocolo Clínico CardioRemoto (UFPB / HULW)
# Metodologia WHO SMART Guidelines — Camada L1 -> L2

pathway:
  id: CardioRemoto
  title: "Telemonitoramento de Pacientes com Diabetes Mellitus e Hipertensão Arterial Sistêmica"
  target_population: "Adultos (>= 18 anos) e idosos com diagnóstico de DM e/ou HAS e fatores de risco cardiovascular aterosclerótico"
  setting: "Ambulatório de Telessaúde da Endocrinologia do Hospital Universitário Lauro Wanderley (HULW/UFPB), João Pessoa/PB"
  version: "0.1.0"
  source: "sources/CardioRemoto/CardioRemoto-Metodologia-HULW-UFPB.docx e sources/CardioRemoto/CardioRemotoDocumentoRequisitosV2.docx"

macrofases:
  - id: M1
    name: "Elegibilidade e Entrada do Paciente"
    source: "Metodologia §7.7.3.2 / Requisitos RF001, RF002"
    description: "Identificação de pacientes no ambulatório do HULW com DM/HAS, aplicação do TCLE e cadastro no sistema mareIA/AGHUX."
  - id: M2
    name: "Triagem Inicial e Coleta"
    source: "Metodologia §7.7.3.3 / Requisitos RF005"
    description: "Coleta de dados antropométricos e vitais por dispositivos IoT certificados ANVISA e envio para realização de exames laboratoriais."
  - id: M3
    name: "Análise de Risco e Classificação Automatizada"
    source: "Metodologia §7.7.3.4 / Requisitos RN001"
    description: "Classificação em Verde (Controlado), Amarelo (Moderado) ou Vermelho (Grave)."
  - id: M4
    name: "Ciclo de Monitoramento Estratificado"
    source: "Metodologia §7.7.3.5 / Requisitos RN002, RN003"
    description: "Visitas periódicas a cada 90 dias (Verde) ou 30 dias (Amarelo/Vermelho), com priorização da agenda por dias de atraso."
  - id: M5
    name: "Sistema de Alertas"
    source: "Metodologia §7.7.3.6 / Requisitos RN004"
    description: "Geração de alertas em 4 níveis (Vermelho - Imediato, Laranja - Semanal/Quinzenal, Amarelo - Quinzenal/Trimestral, Sem disparo)."
  - id: M6
    name: "Ações da Equipe de Saúde"
    source: "Metodologia §7.7.3.7"
    description: "Teleconsulta com endocrinologista/cardiologista, avaliação nutricional, suporte por chat e educação em saúde para DCNT."
  - id: M7
    name: "Integração Hospitalar e Ciclo Contínuo"
    source: "Metodologia §7.7.3.8"
    description: "Sincronização bidirecional com AGHUX (EBSERH) e retorno ao ciclo de monitoramento."

actors:
  - id: patient-cardio
    name: "Paciente com DM/HAS"
    role: "Pessoa cuidada acompanhada pelo Ambulatório de Telessaúde"
    source: "Metodologia §7.4"
  - id: health-agent
    name: "Agente de Saúde / Técnico de Coleta"
    role: "Profissional responsável pelo cadastro, coleta de vitais IoT e registro de visitas"
    source: "Requisitos §4"
  - id: physician-specialist
    name: "Médica Endocrinologista / Equipe de Telessaúde"
    role: "Profissional responsável pelas teleconsultas, ajuste terapêutico e condução clínica dos alertas"
    source: "Metodologia §7.2.3"
  - id: nutritionist
    name: "Nutricionista"
    role: "Profissional de apoio na orientação alimentar, perda de peso e controle lipídico/glicêmico"
    source: "Metodologia §7.7.3.7"
  - id: manager-researcher
    name: "Gestor do Serviço / Pesquisador UFPB"
    role: "Gestão do programa, acompanhamento de indicadores e suporte à plataforma"
    source: "Metodologia §7.4"

data_elements:
  - id: systolic-bp
    name: "Pressão Arterial Sistólica"
    loinc: "8480-6"
    unit: "mmHg"
    type: "quantity"
    source: "Metodologia §7.6.3.3"
  - id: diastolic-bp
    name: "Pressão Arterial Diastólica"
    loinc: "8462-4"
    unit: "mmHg"
    type: "quantity"
    source: "Metodologia §7.6.3.3"
  - id: heart-rate
    name: "Frequência Cardíaca"
    loinc: "8867-4"
    unit: "bpm"
    type: "quantity"
    source: "Metodologia §7.6.3.3"
  - id: capillary-glucose
    name: "Glicemia Capilar"
    loinc: "14743-9"
    unit: "mg/dL"
    type: "quantity"
    source: "Metodologia §7.6.3.3"
  - id: fasting-glucose
    name: "Glicemia de Jejum"
    loinc: "1558-6"
    unit: "mg/dL"
    type: "quantity"
    source: "Metodologia §7.6.3.4"
  - id: hba1c
    name: "Hemoglobina Glicada (HbA1c)"
    loinc: "4548-4"
    unit: "%"
    type: "quantity"
    source: "Metodologia §7.6.3.4"
  - id: ldl-cholesterol
    name: "Colesterol LDL"
    loinc: "13457-7"
    unit: "mg/dL"
    type: "quantity"
    source: "Metodologia §7.6.3.4"
  - id: hdl-cholesterol
    name: "Colesterol HDL"
    loinc: "2085-9"
    unit: "mg/dL"
    type: "quantity"
    source: "Metodologia §7.6.3.4"
  - id: triglycerides
    name: "Triglicerídeos"
    loinc: "2571-8"
    unit: "mg/dL"
    type: "quantity"
    source: "Metodologia §7.6.3.4"
  - id: serum-creatinine
    name: "Creatinina Sérica"
    loinc: "2160-0"
