  - id: waist-circumference
    name: "Circunferência da Cintura"
    loinc: "8280-0"
    unit: "cm"
    type: "quantity"
    source: "Metodologia §7.6.3.2"

decision_rules:
  risk_classification:
    - classification: "Verde (Controlado)"
      criteria: "PA < 140/90 mmHg E HbA1c < 7% E LDL < 130 mg/dL E sem evento cardiovascular no último ano"
      action: "Manutenção do tratamento; monitoramento a cada 90 dias"
    - classification: "Amarelo (Moderado)"
      criteria: "1 ou 2 parâmetros fora da meta E sem evento cardiovascular recente"
      action: "Teleconsulta de ajuste; encaminhamento a nutricionista; monitoramento a cada 30 dias"
    - classification: "Vermelho (Grave)"
      criteria: ">= 3 parâmetros fora da meta OU evento cardiovascular nos últimos 12 meses"
      action: "Avaliação médica prioritária; ajuste terapêutico intensivo; monitoramento a cada 30 dias"
  alert_triggers:
    - level: "Vermelho (Imediato)"
      criteria: "PA >= 180/120 mmHg OU PA < 90/60 mmHg OU Glicemia >= 250 mg/dL com sintomas OU Glicemia < 70 mg/dL OU Sinais de SCA/AVC OU FC > 100 ou < 50 bpm"
      action: "Avaliação médica imediata / encaminhamento para serviço de emergência"
    - level: "Laranja (Semanal a Quinzenal)"
      criteria: "Triglicerídeos > 1000 mg/dL OU Perda de peso involuntária >= 5%"
      action: "Encaminhamento médico + nutricionista"
    - level: "Amarelo (Quinzenal a Trimestral)"
      criteria: "PA fora da meta não crítica OU LDL >= 190 mg/dL OU HbA1c >= 7% OU Glicemia > 300 mg/dL"
      action: "Teleconsulta agendada + encaminhamento a nutricionista"

indicators:
  - id: IND-CARDIO-01
    name: "Proporção de pacientes com PA controlada"
    numerator: "Pacientes com PA sistólica < 140 mmHg e diastólica < 90 mmHg na última aferição"
    denominator: "Total de pacientes cadastrados no programa com HAS"
  - id: IND-CARDIO-02
    name: "Proporção de pacientes com HbA1c controlada"
    numerator: "Pacientes com HbA1c < 7.0% no último exame laboratorial"
    denominator: "Total de pacientes cadastrados no programa com DM"
  - id: IND-CARDIO-03
    name: "Taxa de sincronização offline com sucesso"
    numerator: "Total de registros coletados offline sincronizados com o banco central"
    denominator: "Total de registros gerados offline"
