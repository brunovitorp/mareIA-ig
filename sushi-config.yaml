# SUSHI configuration — Plataforma mareIA (WHO SMART Guidelines Implementation Guide)
# Guia de Implementação FHIR R4 Integrado da Plataforma mareIA abrangendo 4 Pathways:
# 1. CardioRemoto (DM/HAS e Risco Cardiovascular — UFPB/HULW)
# 2. ATENTO 60+ (Telemonitoramento da Pessoa Idosa — UFPE/UFPB)
# 3. FamilIAr_Ativa (Cuidados Paliativos Domiciliares — UFPel/CUIDATIVA)
# 4. AgroSUS (Saúde do Trabalhador Rural — FATEC Ferraz)
id: br.gov.mareia.ig
canonical: https://mareia.saude.gov.br/ig
name: MareIAImplementationGuide
title: "Plataforma mareIA — SMART Guidelines IG (Guia Integrado de Telemonitoramento)"
description: >-
  Implementation Guide integrado da Plataforma mareIA, adaptação digital
  (WHO SMART Guidelines L2/L3) das linhas de cuidado no SUS: CardioRemoto (DM/HAS),
  ATENTO 60+ (Pessoa Idosa), FamilIAr_Ativa (Cuidados Paliativos) e AgroSUS (Trabalhador Rural).
  Programa RNP Redes de Colaboração em Saúde Digital 2025.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC-BY-SA-4.0
publisher:
  name: Plataforma mareIA (UFPB / HULW / UFPE / UFPel / FATEC)
  url: https://mareia.saude.gov.br
language: pt-BR
jurisdiction: urn:iso:std:iso:3166#BR "Brazil"

dependencies:
  hl7.fhir.uv.sdc: 3.0.0
  hl7.fhir.uv.cpg: 1.0.0

