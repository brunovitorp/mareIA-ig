# SUSHI configuration — Plataforma mareIA / Pathway CardioRemoto
# Implementation Guide FHIR R4 (WHO SMART Guidelines L3) para a linha de cuidado
# de pacientes com Diabetes Mellitus (DM) e Hipertensão Arterial Sistêmica (HAS)
# com estratificação de risco cardiovascular aterosclerótico (UFPB / HULW).
id: br.gov.mareia.cardio
canonical: https://mareia.saude.gov.br/ig/cardio
name: MareIACardioRemoto
title: "mareIA — CardioRemoto (SMART Guideline para Telemonitoramento Cardiovascular)"
description: >-
  Implementation Guide da linha de cuidado CardioRemoto da Plataforma mareIA,
  adaptação digital (WHO SMART Guidelines L2/L3) do Protocolo Clínico UFPB/HULW
  para o telemonitoramento de pacientes com Diabetes Mellitus e Hipertensão Arterial
  Sistêmica no Ambulatório de Telessaúde do Hospital Universitário Lauro Wanderley.
  Programa RNP Redes de Colaboração em Saúde Digital 2025.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC-BY-SA-4.0
publisher:
  name: Plataforma mareIA (UFPB / HULW / UFPE / UFPel / FATEC)
  url: https://mareia.saude.gov.br
language: pt-BR
jurisdiction: urn:iso:std:iso:3166#BR "Brazil"

dependencies:
  hl7.fhir.uv.sdc: 3.0.0
  hl7.fhir.uv.cpg: 1.0.0

