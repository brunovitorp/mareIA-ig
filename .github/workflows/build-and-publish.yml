name: Build IG & Publish to Pages

# Compila o Implementation Guide com a imagem oficial do HL7 FHIR IG Publisher
# (hl7fhir/ig-publisher-base) e publica o conteudo de output/ no GitHub Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissoes necessarias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy por vez ocorra (sem cancelar um em andamento)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hl7fhir/ig-publisher-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evitar "dubious ownership" do git dentro do container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Baixar o IG Publisher (publisher.jar)
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o publisher.jar
          ls -la publisher.jar

      - name: Preparar tooling (SUSHI via npm; Java & Jekyll no PATH)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g fsh-sushi
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          echo "/opt/java/openjdk/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/usr/bin" >> "$GITHUB_PATH"
          
          echo "=== Informações de Ambiente ==="
          java -version || true
          sushi --version || true
          ruby -version || true
          jekyll -v || true

      - name: Compilar o IG (SUSHI + IG Publisher com 5GB RAM)
        shell: bash
        run: |
          set -euo pipefail
          export _JAVA_OPTIONS="-Xmx5120m -Dfile.encoding=UTF-8"
          export JAVA_TOOL_OPTIONS="-Xmx5120m -Dfile.encoding=UTF-8"
          
          echo "=== 1. Executando SUSHI ==="
          sushi .
          
          echo "=== 2. Executando HL7 IG Publisher ==="
          java -Xmx5120m -Dfile.encoding=UTF-8 -jar publisher.jar publisher -ig .
          
          # Se a pasta portal existir, copia para output/portal para publicacao conjunta
          if [ -d portal ]; then
            echo "=== 3. Integrando Portal Institucional em output/portal ==="
            mkdir -p output/portal
            cp -r portal/* output/portal/ || true
          fi

      - name: Verificar Relatório de QA
        if: always()
        shell: bash
        run: |
          if [ -f output/qa.txt ]; then
            echo "===== Resumo do QA (output/qa.txt) ====="
            cat output/qa.txt | head -30 || true
            errs=$(grep -m1 -oE "Errors: [0-9]+" output/qa.txt | grep -oE "[0-9]+" || echo 0)
            echo "Erros de QA identificados: ${errs:-0}"
            if [ "${errs:-0}" -gt 0 ]; then
              echo "::warning::IG Publisher reportou ${errs} erro(s) de QA."
            fi
          elif [ -f temp/qa.txt ]; then
            echo "===== Resumo do QA (temp/qa.txt) ====="
            cat temp/qa.txt | head -30 || true
          else
            echo "::warning::Arquivo qa.txt nao encontrado."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (output/) como artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
