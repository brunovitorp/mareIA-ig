name: Build IG & Publish image

# Compila o Implementation Guide com a imagem oficial do HL7 FHIR IG Publisher
# (hl7fhir/ig-publisher-base) e publica o site (output/) numa imagem nginx no
# ghcr.io, usada pelo servidor do NUTES (https://mareia.nutes.ufpe.br/ig).
# O GitHub Pages (brunovitorp.github.io/mareIA-ig) deixou de ser publicado.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Garante que apenas uma publicacao por vez ocorra (sem cancelar uma em andamento)
concurrency:
  group: ig-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hl7fhir/ig-publisher-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evitar "dubious ownership" do git dentro do container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Baixar o IG Publisher (publisher.jar)
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o publisher.jar
          ls -la publisher.jar

      - name: Preparar tooling (SUSHI via npm; Java & Jekyll no PATH)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g fsh-sushi
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          echo "/opt/java/openjdk/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/usr/bin" >> "$GITHUB_PATH"
          
          echo "=== Informações de Ambiente ==="
          java -version || true
          sushi --version || true
          ruby -version || true
          jekyll -v || true

      - name: Compilar o IG (SUSHI + IG Publisher com 5GB RAM)
        shell: bash
        run: |
          set -euo pipefail
          export _JAVA_OPTIONS="-Xmx5120m -Dfile.encoding=UTF-8"
          export JAVA_TOOL_OPTIONS="-Xmx5120m -Dfile.encoding=UTF-8"
          
          echo "=== 1. Executando SUSHI ==="
          sushi .
          
          echo "=== 2. Executando HL7 IG Publisher ==="
          java -Xmx5120m -Dfile.encoding=UTF-8 -jar publisher.jar publisher -ig .
          
          # Se a pasta portal existir, copia para output/portal para publicacao conjunta
          if [ -d portal ]; then
            echo "=== 3. Integrando Portal Institucional em output/portal ==="
            mkdir -p output/portal
            cp -r portal/* output/portal/ || true
          fi

      - name: Verificar Relatório de QA
        if: always()
        shell: bash
        run: |
          if [ -f output/qa.txt ]; then
            echo "===== Resumo do QA (output/qa.txt) ====="
            cat output/qa.txt | head -30 || true
            errs=$(grep -m1 -oE "Errors: [0-9]+" output/qa.txt | grep -oE "[0-9]+" || echo 0)
            echo "Erros de QA identificados: ${errs:-0}"
            if [ "${errs:-0}" -gt 0 ]; then
              echo "::warning::IG Publisher reportou ${errs} erro(s) de QA."
            fi
          elif [ -f temp/qa.txt ]; then
            echo "===== Resumo do QA (temp/qa.txt) ====="
            cat temp/qa.txt | head -30 || true
          else
            echo "::warning::Arquivo qa.txt nao encontrado."
          fi

      - name: Empacotar o site (output/) como artefato
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: output
          retention-days: 7

  # Empacota o mesmo site em uma imagem nginx para o servidor Docker do NUTES
  # (ver docker/docker-compose.yml). O servidor baixa a imagem manualmente.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar o site gerado pelo job build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: output

      - name: Conferir o site em output/
        run: ls output | head

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/brunovitorp/mareia-ig:latest
            ghcr.io/brunovitorp/mareia-ig:${{ github.sha }}
