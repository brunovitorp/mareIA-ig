# Servidor do container. O nginx de borda (150.161.6.123) publica este
# container em https://mareia.nutes.ufpe.br/ig/ removendo o prefixo /ig/,
# por isso os redirecionamentos precisam ser relativos (absolute_redirect off).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/fhir+json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Recursos estáticos mudam só a cada nova versão da imagem.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
    }
}
